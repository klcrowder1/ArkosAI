# Branch Protection Rules Configuration

# This file defines the branch protection rules for the Arkos AI repository.
# These rules are applied using GitHub's branch protection API.

branches:
  - name: master
    protection:
      required_status_checks:
        strict: true
        contexts:
          - "AMD64 Build"
          - "ARM Build"
          - "Jetson Jetpack 6"
          - "AMD64 Extra Build"
          - "ARM Extra Build"
          - "Assemble and push default build"
          - "Build Documentation"
          - "Python Checks"
          - "Python Tests"
          - "Web - Lint"
          - "Web - Test"
      enforce_admins: false
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
        required_approving_review_count: 1
      restrictions: null
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
  
  - name: dev
    protection:
      required_status_checks:
        strict: true
        contexts:
          - "AMD64 Build"
          - "ARM Build"
          - "Jetson Jetpack 6"
          - "AMD64 Extra Build"
          - "ARM Extra Build"
          - "Assemble and push default build"
          - "Build Documentation"
          - "Python Checks"
          - "Python Tests"
          - "Web - Lint"
          - "Web - Test"
      enforce_admins: false
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
        required_approving_review_count: 1
      restrictions: null
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
