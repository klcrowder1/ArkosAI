name: Arkos AI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - integration
          - rtsp
          - performance
          - e2e

jobs:
  # Job to generate test media files
  generate-media:
    name: Generate Test Media
    runs-on: ubuntu-latest
    container:
      image: python:3.9-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            ffmpeg \
            libsm6 \
            libxext6 \
            libgl1-mesa-glx
          pip install numpy opencv-python-headless

      - name: Generate test media
        run: python tests/fixtures/media_generator.py

      - name: Upload test media
        uses: actions/upload-artifact@v3
        with:
          name: test-media
          path: |
            tests/fixtures/sample_videos/
            tests/fixtures/sample_audio/
          retention-days: 1

  # Job to run linting and code quality checks
  lint:
    name: Lint and Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.0

      - name: Run pylint
        run: |
          pylint arkos/ --disable=C0111,C0103,C0303,W0511,R0903,R0902,R0913,R0914 --max-line-length=100 --ignore=migrations --extension-pkg-whitelist=numpy,cv2,tensorflow

      - name: Run mypy
        run: |
          mypy arkos/ --ignore-missing-imports --disallow-untyped-defs --disallow-incomplete-defs --check-untyped-defs --disallow-untyped-decorators --no-implicit-optional --warn-redundant-casts --warn-return-any --warn-unused-ignores

  # Job to run unit tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [generate-media]
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']
        os: [ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsm6 \
            libxext6 \
            libgl1-mesa-glx \
            python3-gi \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-rtsp \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            gir1.2-gst-rtsp-server-1.0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Download test media
        uses: actions/download-artifact@v3
        with:
          name: test-media
          path: tests/fixtures/

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --cov=arkos --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job to run integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [generate-media, unit-tests]
    if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'integration' || github.event_name != 'workflow_dispatch' }}
    services:
      mqtt:
        image: eclipse-mosquitto:2.0
        ports:
          - 1883:1883
          - 9001:9001
        volumes:
          - ${{ github.workspace }}/tests/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
        options: >-
          --health-cmd "mosquitto_sub -t $$SYS/# -C 1 -i healthcheck -W 3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsm6 \
            libxext6 \
            libgl1-mesa-glx \
            python3-gi \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-rtsp \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            gir1.2-gst-rtsp-server-1.0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Download test media
        uses: actions/download-artifact@v3
        with:
          name: test-media
          path: tests/fixtures/

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --cov=arkos --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: integrationtests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job to run RTSP stream tests
  rtsp-tests:
    name: RTSP Stream Tests
    runs-on: ubuntu-latest
    needs: [generate-media, unit-tests]
    if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'rtsp' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build RTSP simulator
        uses: docker/build-push-action@v4
        with:
          context: .
          file: tests/docker/Dockerfile.rtsp-simulator
          load: true
          tags: arkos-rtsp-simulator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download test media
        uses: actions/download-artifact@v3
        with:
          name: test-media
          path: tests/fixtures/

      - name: Start RTSP simulator
        run: |
          docker-compose -f tests/docker/rtsp-streams.yml up -d
          # Wait for RTSP streams to be ready
          chmod +x scripts/wait-for-streams.sh
          ./scripts/wait-for-streams.sh --timeout=60

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsm6 \
            libxext6 \
            libgl1-mesa-glx \
            python3-gi \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-rtsp \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            gir1.2-gst-rtsp-server-1.0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run RTSP tests
        run: |
          python -m pytest tests/rtsp/ -v --cov=arkos --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: rtsptests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Stop RTSP simulator
        run: |
          docker-compose -f tests/docker/rtsp-streams.yml down

  # Job to run performance tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [generate-media, unit-tests]
    if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'performance' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build RTSP simulator
        uses: docker/build-push-action@v4
        with:
          context: .
          file: tests/docker/Dockerfile.rtsp-simulator
          load: true
          tags: arkos-rtsp-simulator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download test media
        uses: actions/download-artifact@v3
        with:
          name: test-media
          path: tests/fixtures/

      - name: Start RTSP simulator
        run: |
          docker-compose -f tests/docker/rtsp-streams.yml up -d
          # Wait for RTSP streams to be ready
          chmod +x scripts/wait-for-streams.sh
          ./scripts/wait-for-streams.sh --timeout=60

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsm6 \
            libxext6 \
            libgl1-mesa-glx \
            python3-gi \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-rtsp \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            gir1.2-gst-rtsp-server-1.0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run performance tests
        run: |
          python -m pytest tests/performance/ -v --benchmark-json=benchmark.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: benchmark.json
          retention-days: 90

      - name: Stop RTSP simulator
        run: |
          docker-compose -f tests/docker/rtsp-streams.yml down

  # Job to run end-to-end tests
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [generate-media, unit-tests, integration-tests, rtsp-tests]
    if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'e2e' || github.event_name != 'workflow_dispatch' }}
    services:
      mqtt:
        image: eclipse-mosquitto:2.0
        ports:
          - 1883:1883
          - 9001:9001
        volumes:
          - ${{ github.workspace }}/tests/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
        options: >-
          --health-cmd "mosquitto_sub -t $$SYS/# -C 1 -i healthcheck -W 3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build RTSP simulator
        uses: docker/build-push-action@v4
        with:
          context: .
          file: tests/docker/Dockerfile.rtsp-simulator
          load: true
          tags: arkos-rtsp-simulator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download test media
        uses: actions/download-artifact@v3
        with:
          name: test-media
          path: tests/fixtures/

      - name: Start RTSP simulator
        run: |
          docker-compose -f tests/docker/rtsp-streams.yml up -d
          # Wait for RTSP streams to be ready
          chmod +x scripts/wait-for-streams.sh
          ./scripts/wait-for-streams.sh --timeout=60

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsm6 \
            libxext6 \
            libgl1-mesa-glx \
            python3-gi \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-rtsp \
            gstreamer1.0-libav \
            libgstrtspserver-1.0-dev \
            gir1.2-gst-rtsp-server-1.0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run E2E tests
        run: |
          python -m pytest tests/e2e/ -v --cov=arkos --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: e2etests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Stop RTSP simulator
        run: |
          docker-compose -f tests/docker/rtsp-streams.yml down

  # Job to run tests on different OS
  os-matrix-tests:
    name: OS Matrix Tests
    runs-on: ${{ matrix.os }}
    needs: [generate-media]
    if: ${{ github.event.inputs.test_type == 'all' || github.event_name != 'workflow_dispatch' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9']
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsm6 \
            libxext6 \
            libgl1-mesa-glx

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Download test media
        uses: actions/download-artifact@v3
        with:
          name: test-media
          path: tests/fixtures/

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v

  # Job to run UI tests
  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    needs: [generate-media, unit-tests]
    if: ${{ github.event.inputs.test_type == 'all' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Node.js dependencies
        working-directory: web
        run: npm ci

      - name: Run UI tests
        working-directory: web
        run: npm test

  # Job to combine coverage reports
  coverage:
    name: Combine Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, rtsp-tests, e2e-tests]
    if: ${{ always() && (github.event.inputs.test_type == 'all' || github.event_name != 'workflow_dispatch') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install coverage
        run: |
          python -m pip install --upgrade pip
          pip install coverage

      - name: Download coverage reports
        uses: actions/download-artifact@v3
        with:
          path: coverage-reports

      - name: Combine coverage reports
        run: |
          coverage combine coverage-reports/*/coverage.xml
          coverage report
          coverage xml

      - name: Upload combined coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: combined
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job to run hardware-specific tests on LattePanda Sigma
  hardware-tests:
    name: Hardware Tests
    runs-on: [self-hosted, lattepanda-sigma]
    needs: [unit-tests]
    if: ${{ github.event.inputs.test_type == 'all' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Download test media
        uses: actions/download-artifact@v3
        with:
          name: test-media
          path: tests/fixtures/

      - name: Run hardware-specific tests
        run: |
          python -m pytest tests/hardware/ -v

  # Job to notify on completion
  notify:
    name: Notify on Completion
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, rtsp-tests, performance-tests, e2e-tests, os-matrix-tests, ui-tests, coverage]
    if: ${{ always() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Notify on success
        if: ${{ success() }}
        run: |
          echo "All tests completed successfully!"
          # Add notification mechanism here (e.g., Slack, Discord, email)

      - name: Notify on failure
        if: ${{ failure() }}
        run: |
          echo "Some tests failed!"
          # Add notification mechanism here (e.g., Slack, Discord, email)
