site_name: Arkos AI Documentation
site_url: https://docs.arkos.ai
site_description: Documentation for Arkos AI - Advanced Network Video Recorder with AI-powered Analytics
site_author: Arkos AI Team

repo_name: ArkosAI/ArkosAI
repo_url: https://github.com/ArkosAI/ArkosAI
edit_uri: edit/dev/docs/

theme:
  name: material
  logo: static/img/logo.png
  favicon: static/img/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
  - redirects:
      redirect_maps:
        'index.md': 'getting-started.md'
  - macros
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: ArkosAI
      repo: ArkosAI
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Installation: installation.md
  - Configuration:
    - Overview: configuration.md
    - Advanced: docs/configuration/advanced.md
    - Audio Detectors: docs/configuration/audio_detectors.md
    - Authentication: docs/configuration/authentication.md
    - Autotracking: docs/configuration/autotracking.md
    - Bird Classification: docs/configuration/bird_classification.md
    - Birdseye: docs/configuration/birdseye.md
    - Event Filtering: docs/configuration/event_filtering.md
    - Camera Specific: docs/configuration/camera_specific.md
    - Cameras: docs/configuration/cameras.md
    - Face Recognition: docs/configuration/face_recognition.md
    - FFmpeg Presets: docs/configuration/ffmpeg_presets.md
    - GenAI: docs/configuration/genai.md
    - Hardware Acceleration (Enrichments): docs/configuration/hardware_acceleration_enrichments.md
    - Hardware Acceleration (Video): docs/configuration/hardware_acceleration_video.md
    - License Plate Recognition: docs/configuration/license_plate_recognition.md
    - Live: docs/configuration/live.md
    - Masks: docs/configuration/masks.md
    - Metrics: docs/configuration/metrics.md
    - Motion Detection: docs/configuration/motion_detection.md
    - Notifications: docs/configuration/notifications.md
    - Object Detectors: docs/configuration/object_detectors.md
    - Object Filters: docs/configuration/object_filters.md
    - Objects: docs/configuration/objects.md
    - PWA: docs/configuration/pwa.md
    - Record: docs/configuration/record.md
    - Reference: docs/configuration/reference.md
    - Restream: docs/configuration/restream.md
    - Review: docs/configuration/review.md
    - Semantic Search: docs/configuration/semantic_search.md
    - Snapshots: docs/configuration/snapshots.md
    - Stationary Objects: docs/configuration/stationary_objects.md
    - TLS: docs/configuration/tls.md
    - Zones: docs/configuration/zones.md
  - Features:
    - Object Detection: features/object-detection.md
    - Event Filtering: features/event-filtering.md
    - Tiered Storage: features/tiered-storage.md
  - Advanced:
    - Hardware Acceleration: advanced/hardware-acceleration.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Contributing: contributing.md
  - MDX: docs/mdx.md
